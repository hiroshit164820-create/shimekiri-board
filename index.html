/* ============================================================
 * 第2層：会社の予定表
 * ============================================================ */
function gotoCompany(coId, selCat){
  /* 会社一覧に戻ったときのために、検索語と絞り込みは持ったまま移動する */
  VIEW = { mode: 'co', coId: coId, selCat: selCat, showArch: !!VIEW.showArch,
           q: VIEW.q || '', filter: VIEW.filter || '' };
  pushRecent(coId);
  storeView();
  render();
}
function gotoHome(){
  VIEW = { mode: 'home', coId: null, selCat: null, showArch: false,
           q: VIEW.q || '', filter: VIEW.filter || '' };
  storeView();
  render();
}
function ymOf(due){ return due ? due.slice(0, 7) : null; }
function ymAdd(ym, n){
  var p = ym.split('-');
  var y = Number(p[0]), m = Number(p[1]) - 1 + n;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return y + '-' + ('0' + (m + 1)).slice(-2);
}
function monthRange(projects){
  var dues = [];
  projects.forEach(function(p){ p.categories.forEach(function(c){ if (c.due) dues.push(ymOf(c.due)); }); });
  dues.push(todayStr().slice(0, 7));
  dues.sort();
  var months = [], cur = dues[0], to = dues[dues.length - 1], guard = 0;
  while (cur <= to && guard < 36) { months.push(cur); cur = ymAdd(cur, 1); guard++; }
  while (months.length < 4) months.push(ymAdd(months[months.length - 1], 1));
  return months;
}

function renderCompany(){
  var co = findCo(VIEW.coId);
  if (!co) { gotoHome(); return; }
  app.innerHTML = '';

  app.appendChild(h('div', { class: 'crumb' }, [
    h('button', { class: 'btn-back', text: '← 会社一覧', onclick: gotoHome }),
    h('h1', { text: co.name }),
    h('button', { class: 'icon-btn', text: '✏️', 'aria-label': '会社名の変更・削除', onclick: function(){ editCompany(co); } })
  ]));
  /* 説明は1行だけにする。スマホでは頭の説明が3〜4行あると、
     肝心の予定が画面に入らなかった（本人の指摘 2026-09-03）。
     読み方の詳しい説明は下の「使い方」に置いてある */
  app.appendChild(h('p', { class: 'page-sub', text: isWide()
    ? '横は月ごとの締切です。予定を押すと、その下にタスクが出ます。'
    : '予定は締切が近い順です。押すと、その下にタスクが出ます。' }));

  app.appendChild(sumBar(coSummary(co)));
  /* 色の読み解きは第1層と同じ部品。ふだんはたたんでおく */
  app.appendChild(buildLegend());

  var archN = archivedProjects(co).length;
  if (archN) {
    app.appendChild(h('div', { class: 'arch-bar' }, [
      h('span', { class: 'num', text: 'しまった業務が ' + archN + ' 件あります' }),
      h('button', {
        text: VIEW.showArch ? '隠す' : '表示する',
        onclick: function(){ VIEW.showArch = !VIEW.showArch; storeView(); render(); }
      })
    ]));
  }

  var projects = VIEW.showArch ? co.projects.slice() : activeProjects(co);
  /* しまったものは最後、次に完了ずみ、残りは締切が近い順（第1層の並びと合わせる） */
  projects.sort(function(a, b){
    var aa = a.archived ? 1 : 0, bb = b.archived ? 1 : 0;
    if (aa !== bb) return aa - bb;
    var ad = projDone(a) ? 1 : 0, bd = projDone(b) ? 1 : 0;
    if (ad !== bd) return ad - bd;
    return String(projNextDue(a) || '9999').localeCompare(String(projNextDue(b) || '9999'));
  });

  if (!projects.length) {
    var empty = h('div', { class: 'tl-card' }, [
      h('div', { class: 'detail-empty', text: 'まだ業務がありません。下のボタンから追加してください。' })
    ]);
    empty.style.padding = '16px 18px';
    app.appendChild(empty);
  } else if (!isWide()) {
    app.appendChild(renderMobileList(co, projects));
  } else {
    var months = monthRange(projects);
    var nowYm = todayStr().slice(0, 7);
    var grid = h('div', { class: 'tl-grid' });
    grid.style.gridTemplateColumns = '320px repeat(' + months.length + ', minmax(132px, 1fr))';

    grid.appendChild(h('div', { class: 'tl-corner', text: '業務' }));
    months.forEach(function(ym){
      var pp = ym.split('-');
      var cell = h('div', { class: 'tl-month num' + (ym === nowYm ? ' is-now' : '') });
      cell.appendChild(h('span', { class: 'yy', text: pp[0] + '年' }));
      cell.appendChild(document.createTextNode(Number(pp[1]) + '月'));
      grid.appendChild(cell);
    });

    projects.forEach(function(p, idx){
      var isLast = idx === projects.length - 1;
      var name = projHeader(co, p);
      if (isLast) name.classList.add('tl-row-last');
      grid.appendChild(name);

      months.forEach(function(ym){
        var cell = h('div', { class: 'tl-cell' + (ym === nowYm ? ' is-now' : '') });
        if (isLast) cell.classList.add('tl-row-last');
        p.categories.filter(function(c){ return ymOf(c.due) === ym; })
          .sort(function(a, b){ return String(a.due).localeCompare(String(b.due)); })
          .forEach(function(c){
            var cnt = catCounts(c);
            var u = urgency(c.due, catDone(c));
            cell.appendChild(h('button', {
              class: 'mchip u-' + u + (VIEW.selCat === c.id ? ' sel' : ''),
              onclick: function(){ VIEW.selCat = c.id; storeView(); render(); }
            }, [
              h('span', { class: 'mchip-name', text: (u === 'done' ? '✓ ' : '') + c.name }),
              h('span', { class: 'mchip-meta num', text: fmtMD(c.due) + ' まで ・ ' + cnt.done + '/' + cnt.total }),
              (function(){
                /* 終わった予定に「番」は無いので出さない */
                var sd = (u === 'done') ? null : sideOf(c);
                return sd ? h('span', { class: 'ball ball-sm b-' + sd.value, text: sd.icon + ' ' + sd.label }) : null;
              })(),
              c.owner ? h('span', { class: 'mchip-owner', text: '👤 ' + c.owner }) : null
            ]));
          });
        grid.appendChild(cell);
      });
    });
    /* 左に固定列があるので、ぼかしは右端だけに出す */
    var tw = makeScroller(grid, co.name + 'の予定表（横に動かせます）', true);
    app.appendChild(h('div', { class: 'tl-card' }, [tw.box]));
  }

  /* 狭い画面では、選んだ予定のすぐ下にタスクを出しているのでここには置かない */
  if (isWide()) app.appendChild(renderDetail(co));
  /* 迷わないよう、すすめたい「ひな形から」を塗りの主ボタンにする */
  app.appendChild(h('div', { class: 'btn-row' }, [
    h('button', { class: 'btn-add primary', text: '＋ ひな形から業務を追加', onclick: function(){ addProject(co, true); } }),
    h('button', { class: 'btn-add', text: '＋ 白紙から業務を追加', onclick: function(){ addProject(co, false); } })
  ]));
}

/* 業務の見出し（月グリッドの左列と、スマホのカード頭で共用する） */
function projHeader(co, p){
  var pd = projDone(p);
  var doneCats = p.categories.filter(catDone).length;

  var acts = h('div', { class: 'p-acts' }, [
    h('button', { class: 'icon-btn', text: '✏️ 編集', onclick: function(){ editProject(co, p); } }),
    h('button', { class: 'icon-btn', text: '➕ 予定', onclick: function(){ addCategory(co, p); } })
  ]);
  if (pd && !p.archived) {
    acts.appendChild(h('button', { class: 'icon-btn', text: '📦 しまう', onclick: function(){
      mutate(function(){ p.archived = true; if (VIEW.selCat && !findCat(co, VIEW.selCat)) VIEW.selCat = null; });
    } }));
  }
  if (p.archived) {
    acts.appendChild(h('button', { class: 'icon-btn', text: '↩ もどす', onclick: function(){
      mutate(function(){ p.archived = false; });
    } }));
  }
  var st = projStatus(p);
  var sd = sideOf(st.cat);
  var status = h('div', { class: 'p-status' }, [
    h('div', { class: 'st-row' }, [
      h('span', { class: 'st-key', text: 'いまの状態' }),
      h('span', { class: 'st-badge u-' + st.badge, text: st.text }),
      st.cat ? h('span', { class: 'st-due num', text: '締切 ' + fmtMD(st.cat.due) + '（' + whenLabel(st.cat.due) + '）' }) : null
    ]),
    h('div', { class: 'st-row' }, [
      h('span', { class: 'st-key', text: '次にやること' }),
      h('span', { class: 'st-val' + (st.next ? '' : ' is-none'), text: st.next || 'ありません' })
    ]),
    h('div', { class: 'st-row' }, [
      h('span', { class: 'st-key', text: 'ボール' }),
      h('span', {
        class: 'ball b-' + (sd ? sd.value : 'none'),
        text: sd ? (sd.icon + ' ' + sd.label) : (st.cat ? '未設定' : '—')
      }),
      (st.cat && st.cat.owner) ? h('span', { class: 'st-owner', text: '👤 ' + st.cat.owner }) : null
    ])
  ]);

  var txt = h('div', { class: 'p-txt' }, [
    h('div', { class: 'p-title', text: (p.archived ? '📦 ' : (pd ? '✓ ' : '')) + p.name }),
    h('div', { class: 'p-meta num', text: '予定 ' + doneCats + '/' + p.categories.length + ' 完了' }),
    status,
    acts
  ]);
  return h('div', {
    class: 'tl-name s-' + projStateKey(p) + ' b-' + projBallKey(p)
      + (pd ? ' p-done' : '') + (p.archived ? ' p-arch' : '')
  }, [
    h('span', { class: 'p-ico', text: p.icon || DEFAULT_ICON }), txt
  ]);
}

/* 閉じたときは、開いていた予定の行まで画面を戻す。
   タスクが長いと、閉じたあとに関係のない場所へ飛ばされるため（本人の指示 2026-09-03） */
function closeDetail(){
  var row = app.querySelector('.mchip.mrow.sel') || app.querySelector('.mchip.sel');
  var box = row ? row.getBoundingClientRect() : null;
  /* 閉じるとパネル（＝この行より下）が消えるだけなので、行の位置は変わらない */
  var keep = box ? (box.top + window.pageYOffset) : null;
  var rowH = box ? box.height : 0;
  VIEW.selCat = null;
  storeView();
  render();
  if (keep === null) return;
  var top = keep - window.pageYOffset;
  /* すでに画面に入っているなら動かさない。見えているものを動かすと、
     どこを見ていたのか分からなくなる */
  if (top >= 0 && top + rowH <= window.innerHeight) return;
  try {
    var soft = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: Math.max(0, keep - 90), behavior: soft ? 'smooth' : 'auto' });
  } catch (e) { window.scrollTo(0, Math.max(0, keep - 90)); }
}

/* 開いたタスクが画面の下に隠れたままにならないよう寄せる */
function scrollDetailIntoView(){
  var det = app.querySelector('.mcats .detail');
  if (!det || !det.scrollIntoView) return;
  var soft = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { det.scrollIntoView({ block: 'nearest', behavior: soft ? 'smooth' : 'auto' }); }
  catch (e) { det.scrollIntoView(false); }
}

/* スマホ用：業務ごとのカードに、予定を締切順の縦並びで入れる */
function renderMobileList(co, projects){
  var list = h('div', { class: 'mlist' });
  projects.forEach(function(p){
    var head = projHeader(co, p);
    head.classList.add('mproj');
    var cats = h('div', { class: 'mcats' });

    var sorted = p.categories.slice().sort(function(a, b){
      return String(a.due || '9999').localeCompare(String(b.due || '9999'));
    });
    if (!sorted.length) {
      cats.appendChild(h('div', { class: 'mcats-empty', text: 'まだ予定がありません。「➕ 予定」から追加できます。' }));
    }
    sorted.forEach(function(c){
      var cnt = catCounts(c);
      var u = urgency(c.due, catDone(c));
      var sel = VIEW.selCat === c.id;
      cats.appendChild(h('button', {
        class: 'mchip mrow u-' + u + (sel ? ' sel' : ''),
        'aria-expanded': sel ? 'true' : 'false',
        onclick: function(){
          if (sel) { closeDetail(); return; }
          VIEW.selCat = c.id;
          storeView();
          render();
          /* 開いたタスクが画面の外に出ないよう、必要なぶんだけ寄せる */
          scrollDetailIntoView();
        }
      }, [
        /* 数字だけでは何の日付か読めなかったので、上に「締切」と添える（本人の指示 2026-09-03） */
        h('span', { class: 'mrow-date num' }, [
          h('span', { class: 'mrow-key', text: u === 'done' ? '締切だった' : '締切' }),
          h('b', { text: fmtMD(c.due) }),
          h('span', { class: 'mrow-left', text: u === 'done' ? '✓ 終わった' : whenLabel(c.due) })
        ]),
        h('span', { class: 'mrow-body' }, [
          h('span', { class: 'mchip-name', text: (u === 'done' ? '✓ ' : '') + c.name }),
          h('span', { class: 'mchip-meta num', text: cnt.done + '/' + cnt.total + ' 完了' }),
          (function(){
            /* 終わった予定に「番」は無いので出さない */
            var sd = (u === 'done') ? null : sideOf(c);
            return sd ? h('span', { class: 'ball ball-sm b-' + sd.value, text: sd.icon + ' ' + sd.label }) : null;
          })(),
          c.owner ? h('span', { class: 'mchip-owner', text: '👤 ' + c.owner }) : null
        ])
      ]));
      /* 選んだ予定のすぐ下にタスクを開く */
      if (sel) cats.appendChild(renderDetail(co));
    });

    list.appendChild(h('div', { class: 'mproj-card s-' + projStateKey(p) + ' b-' + projBallKey(p) }, [head, cats]));
  });
  return list;
}

function renderDetail(co){
  var box = h('div', { class: 'detail' });
  var hit = VIEW.selCat ? findCat(co, VIEW.selCat) : null;
  if (!hit) {
    box.appendChild(h('div', { class: 'detail-empty', text: '上の予定を押すと、ここに細かいタスクが出ます。' }));
    return box;
  }
  var p = hit.p, c = hit.c;
  var u = urgency(c.due, catDone(c));
  var cnt = catCounts(c);

  /* 見出しは2段に分ける。1段目は「どの予定か」と閉じるボタン、2段目は締切などの添え物。
     1つの行に全部入れると、閉じるボタンが折り返して左に落ちた（2026-09-03） */
  box.appendChild(h('div', { class: 'detail-top' }, [
    h('div', { class: 'detail-title' }, [
      h('span', { class: 'where', text: (p.icon || '') + ' ' + p.name + ' の予定' }),
      h('h3', { text: c.name })
    ]),
    /* 予定の行をもう一度押しても閉じられるが、タスクが長いとその行が画面の外にある。
       ここに置いておけば、開いたまま迷子にならない（本人の指示 2026-09-03） */
    h('button', { class: 'icon-btn detail-close', type: 'button', text: '✕ 閉じる',
      'aria-label': 'このタスク一覧を閉じる', onclick: closeDetail })
  ]));
  box.appendChild(h('div', { class: 'detail-head' }, [
    h('span', {
      class: 'detail-due num u-' + u,
      text: '締切 ' + fmtMD(c.due) + '（' + whenLabel(c.due) + '） ・ ' + cnt.done + '/' + cnt.total + ' 完了'
    }),
    (function(){
      var sd = sideOf(c);
      return sd ? h('span', { class: 'ball b-' + sd.value, text: sd.icon + ' ' + sd.label }) : null;
    })(),
    c.owner ? h('span', { class: 'owner-chip', text: '👤 ' + c.owner }) : null,
    h('button', { class: 'icon-btn', text: '✏️ 編集', onclick: function(){ editCategory(co, p, c); } })
  ]));

  var ul = h('ul', { class: 'task-list' });
  c.tasks.forEach(function(t){
    var cb = h('input', { type: 'checkbox' });
    cb.checked = !!t.done;
    cb.addEventListener('change', function(){ mutate(function(){ t.done = cb.checked; }); });

    var del = h('button', { class: 't-del', text: '削除' });
    del.addEventListener('click', function(){
      armDelete(del, 'もう一度押すと削除', function(){
        mutate(function(){ c.tasks = c.tasks.filter(function(x){ return x.id !== t.id; }); });
      });
    });

    var link = safeUrl(t.url);
    /* 狭い画面でも名前と同じ行に収めるため、印と言葉を分けておく。
       リンクは印だけで通じるので言葉を落とし、「メモ」「削除」は言葉を残す（読めないと押せない） */
    var acts = h('div', { class: 't-acts' }, [
      link ? h('a', {
        class: 't-link', href: link, target: '_blank', rel: 'noopener noreferrer',
        title: link, 'aria-label': 'リンクを開く'
      }, [h('span', { class: 't-ico', text: '🔗' }), h('span', { class: 't-word', text: '開く' })]) : null,
      h('button', { class: 't-edit', onclick: function(){ editTask(t); } },
        [h('span', { class: 't-ico', text: '📝' }), h('span', { text: 'メモ' })]),
      del
    ]);

    ul.appendChild(h('li', { class: 'task-item' + (t.done ? ' is-done' : '') }, [
      h('div', { class: 't-main' }, [
        h('label', {}, [cb, h('span', { class: 't-name', text: t.name })]),
        acts
      ]),
      t.note ? h('div', { class: 't-note', text: t.note }) : null
    ]));
  });
  box.appendChild(ul);

  if (catDone(c)) box.appendChild(h('div', { class: 'cat-done-note', text: '🎉 この予定はぜんぶ完了しました' }));
  else if (!c.tasks.length) box.appendChild(h('div', { class: 'cat-warn-note', text: 'タスクを1つ以上追加すると、完了で緑になります。' }));

  var input = h('input', { type: 'text', placeholder: '新しいタスクを入力（例：見積書をもらう）' });
  function addTask(){
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    input.value = '';
    mutate(function(){ c.tasks.push({ id: uid('t'), name: name, done: false }); });
  }
  input.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') addTask(); });
  box.appendChild(h('div', { class: 'task-add' }, [input, h('button', { type: 'button', text: '追加', onclick: addTask })]));
  /* 一覧が長いと、上の「閉じる」まで戻るのがつらい */
  box.appendChild(h('button', { class: 'detail-close-foot', type: 'button', text: '▲ このタスク一覧を閉じる',
    onclick: closeDetail }));
  return box;
}

    onSubmit: function(v){
      mutate(function(){ STATE.companies.push({ id: uid('co'), name: v.name.trim(), projects: [] }); });
    }
  });
}
function editCompany(co){
  openDlg({
    title: '会社の編集',
    fields: [{ key: 'name', label: '会社名', type: 'text', required: true, value: co.name }],
    onSubmit: function(v){ mutate(function(){ co.name = v.name.trim(); }); },
    extras: [{
      label: 'この会社を削除', danger: true,

        mutate(function(){

function addProject(co, preferTemplate){
  var tpls = allTemplates();
  var opts = [{ value: '', label: '使わない（白紙から作る）' }].concat(tpls.map(function(t){
    return {
      value: t.id,
      label: (t.icon || '') + ' ' + t.name,
      sub: t.cats.length + '個の予定が入ります' + (t.builtin ? '（標準ひな形）' : '')
    };
  }));
  openDlg({
    title: '業務を追加',
    lead: co.name + 'に登録します。補助金・助成金のほか、採用や販促などどんな業務でも構いません。',
    fields: [
      { key: 'name', label: '業務の名前（制度名など）', type: 'text', required: true, placeholder: '例：IT導入補助金' },
      { key: 'icon', label: 'アイコン', type: 'emoji', value: DEFAULT_ICON },
      { key: 'tpl', label: 'ひな形', type: 'choice', options: opts,
        value: preferTemplate && tpls.length ? tpls[0].id : '',
        hint: 'ひな形を選ぶと、いつもの予定とタスクがまとめて入ります。' }
    ],
    onSubmit: function(v){
      var proj = { id: uid('p'), name: v.name.trim(), icon: v.icon || DEFAULT_ICON, categories: [] };
      var tpl = v.tpl ? findTemplate(v.tpl) : null;
      if (!tpl) {
        mutate(function(){ co.projects.push(proj); });
        gotoCompany(co.id, null);
        addCategory(co, proj);
        return;
      }
      openDlg({
        title: 'ひな形の日程を決める',
        lead: 'ひな形「' + tpl.name + '」の最初の予定の締切日を入れてください。あとの予定は、ひな形と同じ間隔で自動的に入ります。',
        okLabel: '業務をつくる',
        fields: [{
          key: 'base', label: '最初の予定の締切日', type: 'date', required: true, value: addDays(todayStr(), 14),
          hint: tpl.cats.map(function(tc){
            return tc.name + '（' + (tc.offset ? '＋' + tc.offset + '日' : 'この日') + '）';
          }).join(' / ')
        }],
        onSubmit: function(v2){
          proj.categories = applyTemplate(tpl, v2.base);
          mutate(function(){ co.projects.push(proj); });
          gotoCompany(co.id, proj.categories.length ? proj.categories[0].id : null);
        }
      });
    }
  });
}

function editProject(co, p){
  var extras = [{
    label: '🧩 この業務をひな形として保存',
    run: function(){
      mutate(function(){ STATE.templates.push(templateFromProject(p)); });
      flash('ひな形「' + p.name + '」を保存しました');
    }
  }];
  if (p.archived) {
    extras.push({ label: '↩ しまいから戻す', run: function(){ mutate(function(){ p.archived = false; }); } });
  } else {
    extras.push({ label: '📦 この業務をしまう', run: function(){
      mutate(function(){ p.archived = true; if (VIEW.selCat && !findCat(co, VIEW.selCat)) VIEW.selCat = null; });
    } });
  }
  extras.push({
    label: 'この業務を削除', danger: true,
    run: function(){
      mutate(function(){
        co.projects = co.projects.filter(function(x){ return x.id !== p.id; });
        if (VIEW.selCat && !findCat(co, VIEW.selCat)) { VIEW.selCat = null; storeView(); }
      });
    }
  });
  openDlg({
    title: '業務の編集',
    fields: [
      { key: 'name', label: '業務の名前', type: 'text', required: true, value: p.name },
      { key: 'icon', label: 'アイコン', type: 'emoji', value: p.icon }
    ],
    onSubmit: function(v){ mutate(function(){ p.name = v.name.trim(); p.icon = v.icon || p.icon; }); },
    extras: extras
  });
}

function editTask(t){
  openDlg({
    title: 'タスクのメモとリンク',
    lead: '様式のURLやJグランツの申請ページを貼っておくと、着手のたびに探さずにすみます。',
    fields: [
      { key: 'name', label: 'タスク名', type: 'text', required: true, value: t.name },
      { key: 'note', label: 'メモ（空でも構いません）', type: 'text', value: t.note || '',
        placeholder: '例：担当窓口は商工会議所の田中さん' },
      { key: 'url', label: 'リンク（空でも構いません）', type: 'text', value: t.url || '',
        placeholder: '例：https://www.jgrants-portal.go.jp/',

      });

    }
  });

function addCategory(co, p){
  openDlg({
    title: '予定を追加',

    okLabel: '追加する',
    fields: [
      { key: 'name', label: '予定の名前', type: 'text', required: true, placeholder: '例：書類あつめ' },
      { key: 'due', label: '締切日', type: 'date', required: true, value: addDays(todayStr(), 30) },
      { key: 'side', label: 'いま動く番はどちらですか', type: 'choice', value: 'us',
        options: SIDES.map(function(x){ return { value: x.value, label: x.icon + ' ' + x.label, sub: x.sub }; }),
        hint: '業務カードの「ボール」に出ます。あとから変えられます。' },
      { key: 'owner', label: '担当者の名前（空でも構いません）', type: 'owner', placeholder: '例：山本',
        hint: '番のうえで、実際に手を動かす人の名前です。ひとりで使うなら空のままで大丈夫です。' }
    ],
    onSubmit: function(v){
      var cat = { id: uid('m'), name: v.name.trim(), due: v.due, side: v.side || '', owner: (v.owner || '').trim(), tasks: [] };
      mutate(function(){ p.categories.push(cat); });
      gotoCompany(co.id, cat.id);
    }
  });
}
function editCategory(co, p, c){
  openDlg({
    title: '予定の編集',
    fields: [
      { key: 'name', label: '予定の名前', type: 'text', required: true, value: c.name },
      { key: 'due', label: '締切日', type: 'date', required: true, value: c.due },
      { key: 'side', label: 'いま動く番はどちらですか', type: 'choice', value: c.side || '',
        options: SIDES.map(function(x){ return { value: x.value, label: x.icon + ' ' + x.label, sub: x.sub }; })
          .concat([{ value: '', label: '— まだ決めない', sub: 'ボールの欄が「未設定」になります' }]),
        hint: '業務カードの「ボール」に出ます。' },
      { key: 'owner', label: '担当者の名前（空でも構いません）', type: 'owner', value: c.owner || '', placeholder: '例：山本' }
    ],
    onSubmit: function(v){ mutate(function(){ c.name = v.name.trim(); c.due = v.due; c.side = v.side || ''; c.owner = (v.owner || '').trim(); }); },
    extras: [{
      label: 'この予定を削除', danger: true,
      run: function(){
        mutate(function(){
          p.categories = p.categories.filter(function(x){ return x.id !== c.id; });
          if (VIEW.selCat === c.id) { VIEW.selCat = null; storeView(); }
        });
      }
    }]
  });
}

function flash(msg){
  setPill('st-saved', msg);
  setTimeout(function(){ if (!dirty) setPill('', '保存できます', '変更するとすぐに保存されます'); }, 2500);
}

/* ============================================================
 * 描画
 * ============================================================ */
function render(){
  closeDlg();
  if (VIEW.mode === 'co' && findCo(VIEW.coId)) renderCompany();
  else renderHome();
}
render();

/* 画面の広さが変わったら、月グリッドと縦リストを切り替える。
   入力中に消えると困るので、ダイアログが開いているときは待つ */
(function watchWidth(){
  function onChange(){ if (!dlgRoot.firstChild) render(); }
  if (WIDE_Q.addEventListener) WIDE_Q.addEventListener('change', onChange);
  else if (WIDE_Q.addListener) WIDE_Q.addListener(onChange);
})();

/* 検証用フック（保存機構のラウンドトリップ試験で使用） */
window.__shimekiri = {
  buildHtml: buildHtml,
  getState: function(){ return JSON.parse(JSON.stringify(STATE)); }
};
})();
</script>
